name: Bootstrap stations (weekly refresh)

# Runs Sundays 04:30 UTC to refresh the station/sensor list from the latest
# OpenAQ station roster in the target cities. New stations get monitor rows
# created in Supabase, and the sensor list is written to the Supabase table
# monitor_sensors (migration 32), which the daily + recent-readings ingest
# jobs read on their next run.
#
# Until Nov 2026 this job committed scripts/ingest/target_stations.json back
# to main instead. main now only accepts changes through pull requests, so
# that push was refused every week and the list froze on 18 Oct 2026. Nothing
# is committed any more: the JSON is still written inside the runner (the
# script always writes it) but thrown away when the job ends.
#
# Only touches OpenAQ and Supabase: ~180 OpenAQ requests (one per station to
# check sensor freshness, at 1 per second) and a handful of upserts.
#
# Manual run (Actions tab -> this workflow -> Run workflow) can choose the
# branch, and the dry_run option writes nothing and prints what would change.

on:
  schedule:
    - cron: '30 4 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: read OpenAQ and Supabase, write nothing (true/false)'
        required: false
        default: 'false'

# Read-only: the job only needs to check out the code. All writes go to
# Supabase with the service key.
permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/ingest/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r scripts/ingest/requirements.txt

      - name: Run bootstrap
        env:
          OPENAQ_API_KEY:            ${{ secrets.OPENAQ_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN:                   ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          PYTHONUNBUFFERED:          '1'
        run: python -m scripts.ingest.bootstrap_stations

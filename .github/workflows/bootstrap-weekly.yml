name: Bootstrap stations (weekly refresh)

# Runs Sundays 04:30 UTC to refresh scripts/ingest/target_stations.json
# from the latest OpenAQ station roster in the 3 target cities. New
# stations get monitor rows created in Supabase; the manifest gets
# committed back to the repo if it changed, so the daily/hourly workflows
# see the update immediately on their next run.
#
# Only touches OpenAQ and Supabase — cheap operation (~1 API call to
# OpenAQ, a handful of upserts). Weekly cadence is generous; monthly
# would probably be fine too.

on:
  schedule:
    - cron: '30 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write  # needed to commit the refreshed manifest back to main

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/ingest/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r scripts/ingest/requirements.txt

      - name: Run bootstrap
        env:
          OPENAQ_API_KEY:            ${{ secrets.OPENAQ_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scripts.ingest.bootstrap_stations

      - name: Commit updated manifest if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ingest/target_stations.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "Weekly bootstrap: refresh target_stations.json

            Co-Authored-By: AIgen <noreply@anthropic.com>
            Co-Authored-By: amrita112 <amsi.1994@googlemail.com>"
            git push
          fi

name: Nightly forecast

# Writes 7 days ahead per station into forecast_daily. Cheap -- no model
# fitting, just lookups against the precomputed curves and arithmetic.
#
# Timed after the daily rollup (05:00 UTC), because it reads readings_daily and
# a stale rollup would mean forecasting from yesterday's freshest day rather
# than today's.

on:
  schedule:
    - cron: '30 5 * * *'      # 05:30 UTC, half an hour after the rollup
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what would be written without writing (true/false)'
        required: false
        default: 'false'
      pollutants:
        description: 'Space-separated, e.g. "pm25 aqi"'
        required: false
        default: 'pm25 aqi'

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/ingest/requirements.txt'
      - run: pip install -r scripts/ingest/requirements.txt
      - name: Run nightly forecast
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED:          '1'
          # Inputs arrive as environment variables, never pasted into the
          # script text: pasted, a crafted input would run as shell commands
          # (audit §2.6). Pollutants are also checked against the known list.
          POLLUTANTS_INPUT:          ${{ github.event.inputs.pollutants || 'pm25 aqi' }}
          DRY_RUN_INPUT:             ${{ github.event.inputs.dry_run }}
        run: |
          for p in $POLLUTANTS_INPUT; do
            case "$p" in pm25|pm10|no2|so2|aqi) ;; *) echo "Unknown pollutant: $p"; exit 1 ;; esac
          done
          ARGS=(--pollutants $POLLUTANTS_INPUT)
          if [ "$DRY_RUN_INPUT" = "true" ]; then ARGS+=(--dry-run); fi
          python -m scripts.forecast.nightly_forecast "${ARGS[@]}"

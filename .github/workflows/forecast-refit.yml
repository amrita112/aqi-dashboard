name: Monthly forecast refit

# Rebuilds climatology curves, anomaly-carry weights, the diurnal shape and the
# data-age mode tables from the full history.
#
# Monthly, not nightly: these rest on years of data, so one more month barely
# moves them, and it is the only expensive job in the set.
#
# Reads history back out of readings_daily (--source db) rather than the local
# XKDR parquet export, which is gitignored and absent on a fresh runner. The
# one thing the daily table cannot give back is the hourly series behind the
# diurnal shape, so this run leaves the existing diurnal_shape rows untouched.
# That shape is a month x hour multiplier fitted on a decade of history and
# barely moves between refits; rebuild it locally from parquet
# (`--source parquet`) if it ever needs to change.

on:
  schedule:
    - cron: '0 2 1 * *'       # 02:00 UTC on the 1st
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fit and report without writing (true/false)'
        required: false
        default: 'false'

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/ingest/requirements.txt'
      - run: pip install -r scripts/ingest/requirements.txt
      - name: Run refit
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED:          '1'
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python -m scripts.forecast.refit_params --source db $ARGS

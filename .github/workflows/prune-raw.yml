name: Prune raw readings past the retention window

# Deletes raw readings (and, by cascade, their measurements) older than
# RETENTION_DAYS, but ONLY for days that verify: readings_daily must account
# for exactly as many measurements as the raw rows contain. A day that does not
# reconcile is skipped and reported, never deleted.
#
# Deliberately weekly, not daily. This is the only job in the repo that destroys
# data, there is no rush to reclaim space we are not short of (~167 MB of 500),
# and a weekly cadence leaves a week to notice a problem before the next run.
#
# DELETION IS OFF UNTIL YOU TURN IT ON, then it is automatic.
#
#   Repository variable PRUNE_AUTO_DELETE (Settings -> Secrets and variables ->
#   Actions -> Variables):
#     unset / anything else  scheduled runs are DRY RUNS -- they report what
#                            they would delete and change nothing
#     yes                    scheduled runs delete for real, every week, with
#                            no human in the loop
#
# A manual dispatch always wins over the variable, so you can force a dry run
# even once auto-delete is on, or delete once before switching it on.
#
# It ships unset on purpose. This is the only job that destroys data and it has
# never run against production, so the first few weeks should be dry runs you
# read. Once the reports look right, set the variable once and it is automatic
# from then on -- no code change, and the setting is visible in repo settings
# rather than buried in a workflow file.
#
# Note that the variable controls WHETHER deletion is attempted, not whether it
# is safe. The real protection is the per-day verification in prune_raw.py: a
# day whose rollup does not reconcile with its raw measurements is skipped and
# reported no matter how this is configured.

on:
  schedule:
    # Sundays 03:30 UTC — after the weekly bootstrap (04:30) has not yet run and
    # well clear of the 6-hourly ingest.
    - cron: '30 3 * * 0'
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: 'Type yes to actually delete. Anything else is a dry run.'
        required: false
        default: 'no'
      retention_days:
        description: 'Keep raw readings this recent (minimum 14)'
        required: false
        default: '30'
      prune_orphans:
        description: 'Also delete readings that have no measurements at all'
        required: false
        default: 'no'

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/ingest/requirements.txt'

      - run: pip install -r scripts/ingest/requirements.txt

      - name: Prune raw readings
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RETENTION_DAYS:            ${{ github.event.inputs.retention_days || '30' }}
          # Manual dispatch input wins; otherwise the repository variable
          # decides. Scheduled runs supply no input, so they follow
          # PRUNE_AUTO_DELETE -- unset means dry run.
          CONFIRM_DELETE:            ${{ github.event.inputs.confirm_delete || vars.PRUNE_AUTO_DELETE }}
          PRUNE_ORPHANS:             ${{ github.event.inputs.prune_orphans || vars.PRUNE_AUTO_ORPHANS }}
          PYTHONUNBUFFERED:          '1'
        run: python -m scripts.ingest.prune_raw

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>No connection</title>
    <!--
      Plain HTML with inline styles on purpose: this page has to render when
      the network is gone, so it cannot depend on a stylesheet, a font or a
      JavaScript bundle being fetched.

      It deliberately shows NO air quality figure. A cached reading presented
      without a connection is a stale reading dressed as a current one, and
      not doing that is the thing this product is most careful about.
    -->
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        padding: 2rem 1.5rem; background: #f9fafb; color: #12171b;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 22rem; text-align: center; }
      h1 { font-size: 1.35rem; margin: 1.25rem 0 0.5rem; }
      p { margin: 0 0 1rem; color: #4b5563; line-height: 1.55; }
      button {
        margin-top: 0.5rem; padding: 0.75rem 1.25rem; font-size: 1rem;
        font-weight: 600; color: #fff; background: #2a78d6;
        border: 0; border-radius: 0.5rem; cursor: pointer;
      }
      img { width: 64px; height: 64px; border-radius: 14px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You&rsquo;re offline</h1>
      <p>
        Air quality readings need a connection, and showing you a saved one
        would mean showing you an old one without being able to say how old.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
